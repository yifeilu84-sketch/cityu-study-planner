name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          git worktree add gh-pages-worktree origin/gh-pages
          find gh-pages-worktree -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. gh-pages-worktree/
          touch gh-pages-worktree/.nojekyll
          cd gh-pages-worktree
          git add -A
          if git diff --cached --quiet; then
            echo "No Pages changes to deploy."
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
